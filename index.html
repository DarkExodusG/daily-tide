<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Steady</title>
<meta name="description" content="A private place to ride out urges.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#E8F0EE">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1A1F">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Steady">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#E8F0EE; --bg-2:#F6FAF9; --bg-3:#FFFFFF; --line:#CCDCD8; --line-2:#B4CAC5;
  --ink:#0F2A30; --ink-2:#34525A; --ink-3:#4F6C71;
  --sea:#0F7A65; --sea-hi:#0B6654; --sea-ink:#FFFFFF; --sea-soft:rgba(15,122,101,.11); --sea-mid:rgba(15,122,101,.32);
  --ember:#A9561F; --ember-soft:rgba(169,86,31,.11); --ember-mid:rgba(169,86,31,.34);
  --shadow:0 1px 2px rgba(15,42,48,.06),0 10px 30px -12px rgba(15,42,48,.18);
  --r:20px; --r-sm:12px;
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,"Helvetica Neue",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A1F; --bg-2:#10242A; --bg-3:#152E35; --line:#1E3B43; --line-2:#2A4C55;
    --ink:#E4EEEC; --ink-2:#A9C0C1; --ink-3:#86A1A4;
    --sea:#7ED6BD; --sea-hi:#9BE3CE; --sea-ink:#062019; --sea-soft:rgba(126,214,189,.12); --sea-mid:rgba(126,214,189,.34);
    --ember:#F0B27A; --ember-soft:rgba(240,178,122,.12); --ember-mid:rgba(240,178,122,.36);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 40px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A1F; --bg-2:#10242A; --bg-3:#152E35; --line:#1E3B43; --line-2:#2A4C55;
  --ink:#E4EEEC; --ink-2:#A9C0C1; --ink-3:#86A1A4;
  --sea:#7ED6BD; --sea-hi:#9BE3CE; --sea-ink:#062019; --sea-soft:rgba(126,214,189,.12); --sea-mid:rgba(126,214,189,.34);
  --ember:#F0B27A; --ember-soft:rgba(240,178,122,.12); --ember-mid:rgba(240,178,122,.36);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 40px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);min-height:100dvh;font-variant-numeric:tabular-nums}
::selection{background:var(--sea);color:var(--sea-ink)}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea,select{font-size:16px;caret-color:var(--sea)}
button,a,[role="button"],.chip{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--sea);outline-offset:3px;border-radius:10px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid var(--bg)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:14px;color:var(--ink-3);font-size:11.5px;font-weight:600;letter-spacing:.01em;transition:color .2s,background .2s}
.nav button[aria-current="page"]{color:var(--sea)}
.nav button:active{background:var(--sea-soft)}
.brand{display:none}
main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(108px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:232px 1fr}
  .nav{position:sticky;top:0;height:100dvh;inset:auto;display:flex;flex-direction:column;gap:4px;padding:28px 16px;border-top:0;border-right:1px solid var(--line);background:var(--bg-2);backdrop-filter:none}
  .nav button{flex-direction:row;gap:12px;padding:11px 14px;font-size:15px;justify-content:flex-start}
  .nav button[aria-current="page"]{background:var(--sea-soft)}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 14px 26px;font:650 19px/1 var(--font-d);letter-spacing:-.01em}
  .brand svg{width:30px;height:30px}
  main{padding:52px 40px 80px;max-width:680px}
}
@media (hover:hover) and (pointer:fine){
  .nav button:hover{color:var(--ink)}
  .nav button[aria-current="page"]:hover{color:var(--sea)}
}

/* ---------- type & atoms ---------- */
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance}
h1{font-size:29px;line-height:1.15;font-weight:650;letter-spacing:-.02em}
h2{font-size:20px;line-height:1.25;font-weight:650;letter-spacing:-.01em}
h3{font-size:16.5px;font-weight:650}
p{margin:0}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3);font-size:14px}
.stack>*+*{margin-top:var(--gap,16px)}
.section{margin-top:38px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lede{color:var(--ink-2);margin-top:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:650;font-size:15.5px;transition:transform .12s var(--ease),background .2s,border-color .2s,color .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--sea);color:var(--sea-ink)}
.btn-ghost{border:1px solid var(--line-2);color:var(--ink)}
.btn-quiet{color:var(--ink-2);min-height:44px;padding:0 12px}
.btn-link{color:var(--sea);min-height:44px;padding:0;font-weight:650}
.btn-danger{border:1px solid var(--ember-mid);color:var(--ember)}
.btn-block{width:100%}
.btn-lg{min-height:56px;font-size:16.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
@media (hover:hover) and (pointer:fine){
  .btn-primary:hover{background:var(--sea-hi)}
  .btn-ghost:hover{border-color:var(--ink-3)}
  .btn-quiet:hover{color:var(--ink)}
  .btn-link:hover{text-decoration:underline;text-underline-offset:4px}
}

.panel{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.field{display:block}
.field>span,.label{display:block;font-size:14px;font-weight:650;color:var(--ink-2);margin-bottom:8px}
.input{width:100%;background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea.input{resize:vertical;min-height:96px;line-height:1.55}
.input:focus{border-color:var(--sea);box-shadow:0 0 0 3px var(--sea-soft)}
.input::placeholder{color:var(--ink-3)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg-3);font-size:15px;font-weight:550;color:var(--ink);transition:background .15s,border-color .15s,color .15s,transform .12s var(--ease)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
@media (hover:hover) and (pointer:fine){.chip:not([aria-pressed="true"]):hover{border-color:var(--ink-3)}}

.seg{display:flex;padding:4px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);gap:2px}
.seg button{flex:1;min-height:40px;padding:0 10px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--ink-2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--bg-3);color:var(--ink);box-shadow:var(--shadow)}
.seg.inline{display:inline-flex}
.seg.inline button{flex:none;padding:0 14px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(to right,var(--ember) var(--p,50%),var(--line-2) var(--p,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--ember)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--bg-3);border:2px solid var(--ember);box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--bg-3);border:2px solid var(--ember)}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--ink-2)}
.tag.sea{background:var(--sea-soft);color:var(--sea)}
.tag.ember{background:var(--ember-soft);color:var(--ember)}

/* ---------- today ---------- */
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--ink-2);font-size:15px;min-height:28px}
.sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.sync-pill i{width:7px;height:7px;border-radius:50%;background:var(--sea)}
.sync-pill.off i{background:var(--line-2)}
.sync-pill.err i{background:var(--ember)}
.streak{margin-top:16px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.streak-n{font:650 clamp(84px,24vw,124px)/.86 var(--font-d);letter-spacing:-.045em}
.streak-l{padding-bottom:10px}
.streak-l b{display:block;font:650 21px/1.2 var(--font-d);letter-spacing:-.01em}
.streak-l span{color:var(--ink-2);font-size:15px}
.meta{display:flex;gap:26px;margin-top:20px}
.meta div b{display:block;font:650 21px/1.1 var(--font-d)}
.meta div span{font-size:13.5px;color:var(--ink-2)}

.urge{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;width:100%;margin-top:26px;padding:22px;border-radius:24px;background:var(--sea);color:var(--sea-ink);text-align:left;box-shadow:var(--shadow);transition:transform .14s var(--ease),background .2s}
.urge:active{transform:scale(.98)}
.urge b{display:block;font:650 21px/1.2 var(--font-d);letter-spacing:-.01em}
.urge .urge-sub{display:block;font-size:14.5px;opacity:.85}
.urge .ring{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--sea-ink) 14%,transparent)}
.urge .ring svg{width:28px;height:28px}
.urge-wave{display:block;position:absolute;right:-20px;bottom:-14px;width:190px;opacity:.16;pointer-events:none}
@media (hover:hover) and (pointer:fine){.urge:hover{background:var(--sea-hi)}}

.forecast{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg-2)}
.meter{grid-row:span 2;display:flex;gap:3px;align-items:flex-end;height:28px}
.meter i{width:6px;border-radius:3px;background:var(--line-2)}
.meter i:nth-child(1){height:40%}.meter i:nth-child(2){height:70%}.meter i:nth-child(3){height:100%}
.forecast.low .meter i:nth-child(1){background:var(--sea)}
.forecast.medium .meter i:nth-child(-n+2){background:var(--ember)}
.forecast.high .meter i{background:var(--ember)}
.forecast b{font-weight:650}
.forecast p{color:var(--ink-2);font-size:14.5px}
.forecast.high{border-color:var(--ember-mid);background:var(--ember-soft)}

.checkin{margin-top:14px}
.ci-row{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;padding:5px 0}
.ci-row .label{margin:0;font-size:14px;color:var(--ink);line-height:1.25}
.ci-row .seg{padding:3px}
.ci-row .seg button{min-height:38px;padding:0 4px;font-size:13.5px}
.checkin.panel{padding:14px 16px}
.ci-done{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ci-done p{color:var(--ink-2);font-size:14.5px}

.notes{margin-top:6px}
.note{display:grid;grid-template-columns:10px 1fr;gap:14px;padding:15px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0;padding-top:4px}
.note i{width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--sea)}
.note.ember i{background:var(--ember)}
.note b{display:block;font-weight:650;margin-bottom:3px}
.note p{color:var(--ink-2);font-size:15px}
.note .btn-link{margin-top:2px;min-height:36px}

.reason{position:relative;padding:20px 22px 16px;border-radius:var(--r);background:var(--bg-2);border:1px solid var(--line)}
.reason q{display:block;font:500 19px/1.45 var(--font-d);letter-spacing:-.005em;quotes:none;white-space:pre-wrap}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

/* ---------- journey ---------- */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.cal-h b{font:650 18px var(--font-d)}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:var(--ink-2);flex:none}
.icon-btn:active{background:var(--line)}
@media (hover:hover) and (pointer:fine){.icon-btn:hover{background:var(--bg-2);color:var(--ink)} .icon-btn.del:hover{color:var(--ember);background:var(--ember-soft)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dn{font-size:12px;color:var(--ink-3);text-align:center;font-weight:600;padding-bottom:4px}
.cal .d{position:relative;aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--ink-3);background:transparent}
.cal .d.steady{background:var(--sea-soft);color:var(--ink)}
.cal .d.rode{background:var(--sea-mid);color:var(--ink)}
.cal .d.slip{background:var(--ember-mid);color:var(--ink)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px}
.day-h{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 4px}
.entry{padding:14px 0;border-top:1px solid var(--line)}
.day-h+.entry{border-top:0}
.entry .spread{align-items:flex-start}
.entry-t{font-weight:650}
.entry-s{color:var(--ink-2);font-size:14.5px;margin-top:3px}
.entry-n{margin-top:8px;font-size:15px;white-space:pre-wrap;padding-left:12px;border-left:1px solid var(--line-2)}
.entry-n b{display:block;font-size:13px;color:var(--ink-3);font-weight:650}
.empty{padding:36px 8px;text-align:center;color:var(--ink-2)}
.empty svg{width:120px;height:auto;color:var(--sea);opacity:.7;margin-bottom:12px}

/* ---------- insights ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis div{background:var(--bg-2);padding:16px 18px}
.kpis b{display:block;font:650 28px/1.1 var(--font-d);letter-spacing:-.02em}
.kpis span{font-size:13.5px;color:var(--ink-2)}
.heat{display:grid;grid-template-columns:36px repeat(8,1fr);gap:4px;font-size:11.5px;color:var(--ink-3)}
.heat .c{aspect-ratio:1.25;border-radius:6px;background:color-mix(in srgb,var(--ember) calc(var(--v) * 1%),var(--bg-3));border:1px solid var(--line)}
.heat .lab{display:flex;align-items:center}
.heat .top{text-align:center}
.bars{display:grid;gap:14px}
.bar-row .spread{font-size:15px;margin-bottom:6px}
.bar-row .spread span{color:var(--ink-2);font-size:14px;text-align:right}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--sea);width:var(--w)}
.bar.ember i{background:var(--ember)}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;align-items:end;height:130px}
.weeks div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11.5px;color:var(--ink-3)}
.weeks i{display:block;width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--ember);opacity:.85;min-height:3px}
.facts{display:grid;gap:0}
.fact{padding:14px 0;border-top:1px solid var(--line)}
.fact:first-child{border-top:0;padding-top:0}
.fact b{display:block}
.fact span{color:var(--ink-2);font-size:14.5px}

/* ---------- reflect ---------- */
.prompt{padding:20px 22px;border-radius:var(--r);background:var(--sea-soft)}
.prompt .k{color:var(--sea);font-weight:650;font-size:13.5px;margin-bottom:6px}
.prompt p{font:500 18px/1.45 var(--font-d)}
textarea.writing{min-height:240px;font-size:17px;line-height:1.65;padding:18px}
details.past{border-top:1px solid var(--line);padding:14px 0}
details.past summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;font-weight:600;min-height:28px}
details.past summary::-webkit-details-marker{display:none}
details.past summary span{color:var(--ink-3);font-weight:500;font-size:14px}
details.past .body{margin-top:10px;white-space:pre-wrap;color:var(--ink-2);line-height:1.65}
.plan{padding:16px 0;border-top:1px solid var(--line)}
.plan:first-child{border-top:0;padding-top:4px}
.plan .label{color:var(--ink)}

/* ---------- settings ---------- */
.set{padding:20px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0;padding-top:0}
.set .faint{margin-top:6px}
.qr{display:grid;place-items:center;background:#fff;border-radius:16px;padding:14px;width:min(260px,100%);margin:16px auto 8px}
.qr svg{width:100%;height:auto;display:block}
.code{font:600 17px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.06em;text-align:center;word-break:break-all;padding:12px;border-radius:12px;background:var(--bg-3);border:1px solid var(--line);-webkit-user-select:all;user-select:all}

/* ---------- overlay (urge flow) ---------- */
.layer{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 0;animation:layerIn .38s var(--ease)}
@keyframes layerIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.layer-in{max-width:560px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
.layer-top{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-bottom:6px}
.layer-top .faint{font-weight:650}
svg.wave{width:100%;height:auto;display:block;overflow:visible}
.wave-base{fill:none;stroke:var(--line-2);stroke-width:2.5;stroke-linecap:round}
.wave-area{fill:var(--sea-soft)}
.wave-done{fill:none;stroke:var(--sea);stroke-width:3.5;stroke-linecap:round}
.wave-dot{fill:var(--sea);filter:drop-shadow(0 0 10px var(--sea))}
.wave-labels{display:flex;justify-content:space-between;font-size:12.5px;font-weight:650;letter-spacing:.03em;color:var(--ink-3);margin-top:6px;padding:0 2px}
.wave-labels span.on{color:var(--sea)}
.clock{text-align:center;margin-top:14px}

(()=>{

/* ================= constants ================= */

  bored:'start something with my hands: cook, clean, play, build',stress:'do 20 push-ups and a cold shower',night:'put my phone in another room and go to sleep',

if(!D||D.v!==2){

/* ================= helpers ================= */

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtTime=ts=>new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const todayKey=()=>dayKey(Date.now());
function fmtDay(ts){const d=new Date(ts),t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString())return'Today';if(d.toDateString()===y.toDateString())return'Yesterday';
  return d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'});}
const h12=h=>{h=((h%24)+24)%24;return h===0?'12am':h<12?h+'am':h===12?'12pm':(h-12)+'pm';};

const sortByTs=a=>a.sort((x,y)=>x.ts-y.ts||(x.id<y.id?-1:1));
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};
const vibrate=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};

const ICON={
  today:'<path d="M2.5 15.5c2.6 0 3.1-7 6.1-7s3.6 7 6.3 7 3.3-4 6.6-4"/>',
  journey:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',

};

function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
function ask(title,body,ok='Confirm',danger=false){return new Promise(res=>{

/* ================= stats ================= */
const live=()=>D.entries;
const slips=()=>D.entries.filter(e=>e.outcome==='slipped').map(e=>e.ts).sort((a,b)=>a-b);
function streakStart(){const sl=slips().filter(t=>t>=D.start);return sl.length?sl[sl.length-1]:D.start;}
/* calendar days between two moments: a slip at 11pm counts as day 1 the next morning */
const midnight=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};

    .forEach(e=>e.actions.forEach(a=>{m[a]=m[a]||{n:0,w:0};m[a].n++;if(e.outcome==='rode')m[a].w++;}));

  const t=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];return t&&t[1]>=3?{id:t[0],n:t[1]}:null;}

/* how much more likely urges are on "bad" check-in days, per factor */
function correlations(){
  if(D.checkins.length<6)return[];
  const perDay={};D.entries.forEach(e=>{const k=dayKey(e.ts);perDay[k]=(perDay[k]||0)+1;});

  return out.sort((a,b)=>b.lift-a.lift);
}

  const hit=past.filter(x=>s>=x-3&&s<=x);return hit.length?{s,past:hit}:null;}

/* risk forecast for right now / tonight */
function forecast(){
  const E=D.entries,now=new Date(),reasons=[];let score=0;
  if(E.length>=5){
    const blk=Math.floor(now.getHours()/3),share=E.filter(e=>Math.floor(new Date(e.ts).getHours()/3)===blk).length/E.length,lift=share*8;
    score+=Math.max(-8,Math.min(30,(lift-1)*14));if(lift>=1.8)reasons.push('this time of day');
    const w=now.getDay(),ws=E.filter(e=>new Date(e.ts).getDay()===w).length/E.length*7;
    score+=Math.max(-5,Math.min(18,(ws-1)*10));if(ws>=1.6)reasons.push(DAYS[w]+'s');

  const day24=E.filter(e=>Date.now()-e.ts<DAY).length;if(day24){score+=Math.min(30,day24*12);reasons.push(plural(day24,'urge')+' in the last day');}

    const add=c?Math.max(0,Math.min(22,(c.lift-1)*14)):5;score+=add;if(!c||c.lift>=1.25)reasons.push(f.word);}});}
  const level=score>=45?'high':score>=22?'medium':'low';
  return{level,score,reasons:reasons.slice(0,3)};

  }

  const cor=correlations()[0];

  const tt=topTrigger();
  if(tt){const w=whatWorked(tt.id)[0];
    if(!planFor(tt.id))N.push({tone:'sea',p:5,title:`Make a plan for “${tLabel(tt.id).toLowerCase()}”`,body:'It’s your most common trigger. Deciding what you’ll do ahead of time makes it far easier in the moment.',act:'plans',actL:'Make a plan'});
    else if(w&&w.rate>=.5)N.push({tone:'sea',p:3,title:`For “${tLabel(tt.id).toLowerCase()}”, “${aLabel(w.a).toLowerCase()}” works`,body:`It helped you ride it out ${w.w} of ${w.n} times.`});}
  const tm=typicalMinutes();if(tm&&tm+3<D.timerMin)N.push({tone:'sea',p:2,title:`Your urges usually pass in about ${tm} minutes`,body:'Knowing that makes the next one easier: you only have to hold on that long.'});
  const r=E.filter(e=>now-e.ts<14*DAY),pr=E.filter(e=>now-e.ts>=14*DAY&&now-e.ts<28*DAY),avg=a=>a.reduce((s,e)=>s+(e.intensity||5),0)/a.length;
  if(r.length>=3&&pr.length>=3){const a=avg(r),b=avg(pr);if(a<b-.5)N.push({tone:'sea',p:3,title:'Your urges are getting weaker',body:`Average strength ${a.toFixed(1)} over the last two weeks, down from ${b.toFixed(1)}. That’s the habit losing its hold.`});}
  let run=0;for(let i=E.length-1;i>=0&&E[i].outcome==='rode';i--)run++;
  if(run>=3)N.push({tone:'sea',p:3,title:`${run} urges in a row, ridden out`,body:'Each one you outlast makes the next a little easier.'});
  N.push(encourage());
  return N.sort((a,b)=>b.p-a.p);
}

function vJourney(){
  const now=new Date();if(!UI.cal)UI.cal=todayKey().slice(0,7);
  const [Y,M]=UI.cal.split('-').map(Number),first=new Date(Y,M-1,1),dim=new Date(Y,M,0).getDate(),lead=(first.getDay()+6)%7;
  const byDay={};D.entries.forEach(e=>{const k=dayKey(e.ts);(byDay[k]=byDay[k]||[]).push(e);});
  const startK=dayKey(D.start),tk=todayKey();
  let cal='<div class="cal">'+['M','T','W','T','F','S','S'].map(d=>`<span class="dn">${d}</span>`).join('')+'<span></span>'.repeat(lead);
  for(let d=1;d<=dim;d++){const k=`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`,es=byDay[k]||[];
    let c='';if(es.some(e=>e.outcome==='slipped'))c='slip';else if(es.length)c='rode';else if(k>=startK&&k<=tk)c='steady';
    cal+=`<span class="d ${c} ${k===tk?'today':''}" title="${es.length?plural(es.length,'urge'):''}">${d}</span>`;}
  cal+='</div>';
  const monthEntries=D.entries.filter(e=>dayKey(e.ts).slice(0,7)===UI.cal).reverse();
  let list='',last='';
  monthEntries.forEach(e=>{const dd=fmtDay(e.ts);if(dd!==last){list+=`<div class="day-h">${esc(dd)}</div>`;last=dd;}

      <div class="entry-s">${esc(tLabel(e.trigger))}${e.intensity?` · strength ${e.intensity}/10`:''}${e.durationSec&&e.kind==='urge'?` · ${Math.max(1,Math.round(e.durationSec/60))} min`:''}${e.actions&&e.actions.length?' · '+e.actions.map(a=>esc(aLabel(a).toLowerCase())).join(', '):''}</div>

function vInsights(){

  const rode=wins(),rate=Math.round(rode/E.length*100),now=Date.now(),r=E.filter(e=>now-e.ts<14*DAY),avg=a=>a.length?(a.reduce((s,e)=>s+(e.intensity||5),0)/a.length).toFixed(1):'–';
  const grid=Array.from({length:7},()=>Array(8).fill(0));E.forEach(e=>{const d=new Date(e.ts);grid[(d.getDay()+6)%7][Math.floor(d.getHours()/3)]++;});
  const mx=Math.max(1,...grid.flat()),dn=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  grid.forEach((row,i)=>{heat+=`<span class="lab">${dn[i]}</span>`+row.map(v=>`<span class="c" style="--v:${v?18+Math.round(v/mx*72):0}" title="${v}"></span>`).join('');});heat+='</div>';
  const tm={};E.forEach(e=>{const k=e.trigger||'other';tm[k]=tm[k]||{n:0,w:0};tm[k].n++;if(e.outcome==='rode')tm[k].w++;});

    :'<p class="muted">Tap what you’re doing during an urge. Once something’s been used twice, you’ll see how well it works here.</p>';
  const cor=correlations();

    :`<p class="muted">After about a week of daily check-ins, this shows which kinds of days lead to urges, like poor sleep or loneliness. ${D.checkins.length} of 6 check-ins so far.</p>`;
  const wk=[];for(let i=7;i>=0;i--){const a=now-(i+1)*7*DAY,b=now-i*7*DAY,x=E.filter(e=>e.ts>=a&&e.ts<b);wk.push({n:x.length,avg:x.length?x.reduce((s,e)=>s+(e.intensity||5),0)/x.length:0,l:i===0?'now':i+'w'});}

  <div class="section"><h2>Urge strength by week</h2><p class="faint" style="margin:4px 0 14px">Lower bars mean the urges are getting weaker.</p>${weeks}</div>
  ${past.length?`<div class="section"><h2>Past streaks</h2><p class="muted" style="margin-top:8px">${past.map(x=>plural(x,'day')).join(' · ')}${dangerZone()?'. You’re close to where past streaks ended. Stay alert.':''}</p></div>`:''}`;
}

/* ================= merge & sync ================= */
function mergeData(a,b){
  a=Object.assign(fresh(),a);b=Object.assign(fresh(),b);
  const out=fresh();const tomb=Object.assign({},a.tomb,b.tomb);
  Object.keys(tomb).sort().forEach(k=>out.tomb[k]=tomb[k]);
  const coll=k=>{const m=new Map();[...(a[k]||[]),...(b[k]||[])].forEach(x=>{if(!x||!x.id||out.tomb[x.id])return;const c=m.get(x.id);if(!c||(x.u||x.ts||0)>(c.u||c.ts||0))m.set(x.id,x);});return sortByTs([...m.values()]);};
  out.entries=coll('entries');out.journal=coll('journal');out.checkins=coll('checkins');
  const s=(a.settingsU||0)>=(b.settingsU||0)?a:b;out.start=s.start;out.reason=s.reason;out.timerMin=s.timerMin;out.settingsU=s.settingsU||0;
  const pk=[...new Set([...Object.keys(a.plans||{}),...Object.keys(b.plans||{})])].sort();
  pk.forEach(k=>{const x=(a.plans||{})[k],y=(b.plans||{})[k];out.plans[k]=!x?y:!y?x:((x.u||0)>=(y.u||0)?x:y);});
  const la=a.letter,lb=b.letter;out.letter=!la?lb||null:!lb?la:((la.u||0)>=(lb.u||0)?la:lb);
  out.onboarded=!!(a.onboarded||b.onboarded);
  return out;
}
const canon=x=>JSON.stringify(mergeData(x,fresh()));
const enc=new TextEncoder(),dec=new TextDecoder();
const toHex=buf=>[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');
const sha=s=>crypto.subtle.digest('SHA-256',enc.encode(s));
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newSecret(){const b=crypto.getRandomValues(new Uint8Array(20));let s='';for(const x of b)s+=B32[x&31];/* 5 bits each */
  const extra=crypto.getRandomValues(new Uint8Array(12));for(const x of extra)s+=B32[x&31];return s;} /* 32 chars = 160 bits */
const fmtSecret=s=>s.match(/.{1,4}/g).join('-');
const cleanSecret=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
let keyCache=null;
async function syncKeys(secret){
  if(keyCache&&keyCache.secret===secret)return keyCache;
  const id=toHex(await sha('steady-id:'+secret)),write=toHex(await sha('steady-write:'+secret));
  const key=await crypto.subtle.importKey('raw',await sha('steady-key:'+secret),'AES-GCM',false,['encrypt','decrypt']);
  return keyCache={secret,id,write,key};
}
async function seal(k,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k.key,enc.encode(JSON.stringify(obj)));return'v1.'+b64(iv)+'.'+b64(ct);}
async function unseal(k,blob){const [v,iv,ct]=blob.split('.');if(v!=='v1')throw new Error('format');return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},k.key,unb64(ct))));}
async function rpc(fn,body){
  const r=await fetch(SB_URL+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});
  const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));return j;}
let syncState='idle',syncing=false,syncAgain=false,syncTimer=null;
function queueSync(){if(!L.sync)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1500);}
async function syncNow(manual){
  if(!L.sync)return;if(!navigator.onLine){syncState='error';if(manual)toast('You’re offline. It’ll sync when you’re back online.');return;}
  if(syncing){syncAgain=true;return;}syncing=true;syncState='syncing';updatePill();
  const before=canon(D);
  try{const k=await syncKeys(L.sync.secret);
    for(let i=0;i<5;i++){
      const rows=await rpc('vault_get',{p_id:k.id});let rv=0,rh=null;
      if(rows&&rows.length){rv=rows[0].ver;
        if(rv===L.sync.ver&&L.sync.hash)rh=L.sync.hash;
        else{const R=await unseal(k,rows[0].blob);rh=toHex(await sha(canon(R)));D=mergeData(D,R);save(false);}}
      const c=canon(D),mh=toHex(await sha(c));
      if(mh===rh){L.sync.ver=rv;L.sync.hash=mh;break;}
      const nv=await rpc('vault_put',{p_id:k.id,p_write:k.write,p_blob:await seal(k,JSON.parse(c)),p_base_ver:rv});
      if(nv>0){L.sync.ver=nv;L.sync.hash=mh;break;}
    }
    L.sync.last=Date.now();saveLocal();syncState='ok';if(manual)toast('Synced');
  }catch(err){syncState='error';if(manual)toast(/forbidden/.test(err.message)?'This sync code isn’t valid anymore':'Sync failed. It’ll retry automatically.');}
  syncing=false;updatePill();
  if(canon(D)!==before&&!flow)render();
  if(syncAgain){syncAgain=false;queueSync();}
}
function updatePill(){const p=document.querySelector('.hello .sync-pill');if(p)p.outerHTML=syncPill();}
async function syncOn(){
  if(!(window.crypto&&crypto.subtle)){toast('Sync needs the installed app (secure connection)');return;}
  L.sync={secret:newSecret(),ver:0,hash:null,last:null};saveLocal();render();await syncNow(true);render();showPair();
}
async function joinSync(code){
  const s=cleanSecret(code);if(s.length!==32||[...s].some(c=>!B32.includes(c))){toast('That code doesn’t look right. Check it and try again.');return false;}
  L.sync={secret:s,ver:0,hash:null,last:null};saveLocal();
  const k=await syncKeys(s);let rows;try{rows=await rpc('vault_get',{p_id:k.id});}catch(e){toast('Couldn’t reach the sync server. Check your connection.');L.sync=null;saveLocal();return false;}
  if(!rows||!rows.length){toast('No synced data found for that code.');L.sync=null;saveLocal();return false;}
  /* the device being connected defers to the existing synced settings (start date, reason, timer) */
  D.settingsU=0;if(D.letter&&!D.letter.text)D.letter=null;save(false);
  await syncNow();D.onboarded=true;save(false);render(true);toast('Connected. Your devices are now in sync.');return true;
}

        <circle class="wave-dot" id="waveDot" r="8" cx="6" cy="128"/></svg>
        <div class="wave-labels"><span data-ph="0">Rising</span><span data-ph="1">Peak</span><span data-ph="2">Passing</span></div></div>
      <div class="clock"><b id="clk">${mmss(A.durMin*60000)}</b><span id="phase" aria-live="polite">Let it come. You don’t have to act on it.</span></div>
      <div class="breath"><span class="breath-ring"><i></i></span><span id="breath">Breathe in</span></div>
      ${D.reason?`<div class="reason" style="margin-top:28px"><div class="faint" style="margin-bottom:8px;font-weight:650">Why you’re doing this</div><q>${esc(D.reason)}</q></div>`:''}
      <div class="tips" id="tips" style="margin-top:14px">${tipsHTML(A)}</div>
      <div class="section" style="margin-top:30px"><h3 style="margin-bottom:12px">What set it off? <span class="faint" style="font-weight:500">Optional, helps the app learn</span></h3>${chipsHTML(TRIGGERS,A.trigger,'trigger')}
        <div style="margin-top:16px"><span class="label">How strong is it?</span>${rangeHTML(A.intensity)}</div></div>
      <div class="section" style="margin-top:30px"><div class="seg" role="group" aria-label="Tools">${[['steps','Steps'],['ground','Ground me'],['letter','Letter']].map(([k,l])=>`<button data-f="tool" data-v="${k}" aria-pressed="${flow.tool===k}">${l}</button>`).join('')}</div>
        <div class="tool" id="tool">${toolHTML()}</div></div>
      <div class="section" style="margin-top:26px"><h3 style="margin-bottom:12px">What are you doing right now?</h3>${chipsHTML(ACTIONS,A.actions,'action',true)}</div>
      <div class="dock"><button class="btn btn-primary btn-lg" data-f="passed">It passed</button><button class="btn btn-ghost" data-f="plus5" aria-label="Add 5 minutes">+5 min</button><button class="btn btn-quiet" data-f="slipped">I slipped</button></div>`;
  }else if(st==='check'){
    const strong=A&&A.intensity>=8,mins=Math.round((Date.now()-A.start)/60000);
    h=top('Time’s up',false)+`<div class="center stack" style="--gap:12px;margin-top:8vh"><h1>You held on for ${plural(mins,'minute')}.</h1><p class="muted">How is it now?</p></div>
      <div class="stack" style="margin-top:28px;--gap:10px"><button class="btn btn-primary btn-block btn-lg" data-f="passed">It passed</button>
      <button class="btn btn-ghost btn-block btn-lg" data-f="more">Still strong: ride another ${strong?'10':'5'} minutes</button></div>
      <div class="panel" style="margin-top:22px"><h3>If it’s still overwhelming</h3>
        <ol class="steps" style="margin-top:10px">
          <li><div><b>Get out, right now</b><span>Shoes on, leave the house. Go somewhere with people: a shop, a café, a walk on a busy street. It’s very hard to act on an urge in public.</span></div></li>
          <li><div><b>Leave your phone behind</b><span>Or put it in your pocket and don’t touch it until you’re back.</span></div></li>
          <li><div><b>Shock your body</b><span>Cold shower or cold water on your face for 30 seconds. It resets your nervous system fast.</span></div></li>
          <li><div><b>Remember: you’re ${plural(mins,'minute')} in</b><span>The hardest part is already behind you. Strong urges sometimes come in a second wave, and that one is usually weaker.</span></div></li>
        </ol></div>
      <button class="btn btn-quiet btn-block" style="margin-top:14px" data-f="slipped">I slipped</button>`;
  }else if(st==='doneRode'){
    const w=wins(),e=D.entries.find(x=>x.id===flow.result);
    h=top('Logged',false)+`<svg class="done-mark" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="40" fill="var(--sea-soft)"/><path d="M24 43l12 12 25-26" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="center stack" style="--gap:10px"><h1>You rode it out.</h1><p class="muted">That’s ${plural(w,'urge')} you’ve beaten${e&&e.durationSec>45?`. This one took ${plural(Math.max(1,Math.round(e.durationSec/60)),'minute')}`:''}. It counts.</p></div>
      <div class="stack section" style="--gap:16px">
        ${e&&!e.trigger?`<div><span class="label">What set it off? (optional)</span>${chipsHTML(TRIGGERS,null,'doneTrigger')}</div>`:''}
        <label class="field"><span>Anything worth remembering? (optional)</span><textarea class="input" id="fnote" placeholder="What helped, what you noticed…"></textarea></label>
        <button class="btn btn-primary btn-block btn-lg" data-f="finish">Done</button></div>`;
  }else if(st==='slip'||st==='doneSlip'){
    const fromRide=st==='doneSlip',e=fromRide&&D.entries.find(x=>x.id===flow.result),s=flow.slip;
    h=top(fromRide?'It happened':'Log a slip')+`<div class="stack" style="--gap:10px;margin-top:2vh"><h1>${fromRide?'Okay. Breathe. This isn’t the end of anything.':'Thanks for being honest with yourself.'}</h1>
      <p class="muted">${fromRide?'Your day count resets, but every urge you’ve ridden out still counts. People who make it to years aren’t the ones who never slip. They’re the ones who start again the next day.':'Logging it isn’t punishment. A few honest answers now are how you spot it coming next time.'}</p></div>
      <div class="stack section" style="--gap:22px">
        ${!fromRide||(e&&!e.trigger)?`<div><span class="label">What set it off?</span>${chipsHTML(TRIGGERS,s.trigger,'strigger')}</div>`:''}
        ${!fromRide?`<div><span class="label">How strong was the urge?</span>${rangeHTML(s.intensity)}</div>`:''}
        <label class="field"><span>What happened right before?</span><textarea class="input" id="rBefore" placeholder="Where you were, what you were doing, what you saw…"></textarea></label>
        <label class="field"><span>What were you feeling underneath?</span><textarea class="input" id="rFeeling" placeholder="Lonely, rejected, bored, angry, thinking about her…"></textarea></label>
        <label class="field"><span>What will you do differently next time?</span><textarea class="input" id="rNext" placeholder="The app will remind you of this when the same trigger shows up."></textarea></label>
        <button class="btn btn-primary btn-block btn-lg" data-f="${fromRide?'finishSlip':'saveSlip'}">${fromRide?'Start again':'Save'}</button></div>`;
  }
  LY.innerHTML=`<div class="layer-in">${h}</div>`;LY.scrollTop=0;
  const f=LY.querySelector('h1');if(f){f.setAttribute('tabindex','-1');f.focus({preventScroll:true});}
  if(st==='ride'){keepAwake(true);tick();tickT=setInterval(tick,250);}else keepAwake(false);
}
function tick(){
  const A=L.active;if(!A||!flow||flow.step!=='ride')return;
  const total=A.durMin*60000,el=Date.now()-A.start,p=Math.min(1,el/total);
  const c=$('#clk');if(!c)return;c.textContent=mmss(total-el);
  const path=$('#waveDone'),len=path.getTotalLength(),pt=path.getPointAtLength(len*p);
  path.style.strokeDasharray=len;path.style.strokeDashoffset=len*(1-p);
  $('#waveDot').setAttribute('cx',pt.x);$('#waveDot').setAttribute('cy',pt.y);$('#wclipRect').setAttribute('x',6);$('#wclipRect').setAttribute('width',Math.max(0,pt.x-6));
  const ph=p<.3?0:p<.5?1:2;
  if(ph!==A.phase){A.phase=ph;saveLocal();vibrate(ph===1?[80]:[40,60,40]);}
  LY.querySelectorAll('[data-ph]').forEach(s=>s.classList.toggle('on',+s.dataset.ph===ph));
  const msg=['Let it come. You don’t have to act on it.','This is the peak. It’s the hardest part, and it won’t last.','It’s already weakening. Stay with it.'][ph];
  const pe=$('#phase');if(pe.textContent!==msg)pe.textContent=msg;
  const b=$('#breath'),bt=(el/1000)%10<4?'Breathe in':'Breathe out';if(b.textContent!==bt)b.textContent=bt;
  if(p>=1){vibrate([200,100,200]);flow.step='check';drawFlow();}
}
function finishUrge(outcome){
  const A=L.active;if(!A)return;const now=Date.now();
  const e={id:uid(),ts:A.start,u:now,kind:'urge',trigger:A.trigger,intensity:A.intensity,actions:A.actions.slice(),outcome,note:'',durationSec:Math.round((now-A.start)/1000)};
  D.entries.push(e);sortByTs(D.entries);L.active=null;saveLocal();save();flow.result=e.id;flow.step=outcome==='rode'?'doneRode':'doneSlip';drawFlow();
}
function reflectVals(){const v=id=>(($('#'+id)||{}).value||'').trim();const r={before:v('rBefore'),feeling:v('rFeeling'),next:v('rNext')};return(r.before||r.feeling||r.next)?r:null;}
LY.addEventListener('input',e=>{
  if(e.target.dataset.f==='intensity'){const v=+e.target.value;e.target.style.setProperty('--p',(v-1)/9*100+'%');$('#iv').textContent=v+'/10';
    if(flow.step==='slip')flow.slip.intensity=v;
    else if(L.active){const A=L.active;A.intensity=v;
      if(v>=8&&!A.stretched){const el=Date.now()-A.start;A.durMin=Math.max(A.durMin,25,Math.ceil(el/60000)+10);A.stretched=true;tick();toast(`Strong urges take longer. Timer stretched to ${A.durMin} minutes.`);}
      saveLocal();}}
});
LY.addEventListener('click',async e=>{
  const t=e.target.closest('[data-f]');if(!t||!flow)return;const f=t.dataset.f,A=L.active;
  const pick=(sel,v)=>LY.querySelectorAll(`[data-f="${sel}"]`).forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===v));
  if(f==='close'){
    if(flow.step==='ride'&&A){if(!await ask('Stop the timer?','Nothing will be logged. You can start again any time.','Stop'))return;L.active=null;saveLocal();}
    else if(flow.step==='doneRode'||flow.step==='doneSlip'){/* already saved */}
    closeFlow();
  }
  else if(f==='trigger'){A.trigger=A.trigger===t.dataset.v?null:t.dataset.v;saveLocal();pick('trigger',A.trigger);$('#tips').innerHTML=tipsHTML(A);if(flow.tool==='steps')$('#tool').innerHTML=toolHTML();}
  else if(f==='strigger'){flow.slip.trigger=t.dataset.v;pick('strigger',t.dataset.v);}
  else if(f==='doneTrigger'){const en=D.entries.find(x=>x.id===flow.result);if(en){en.trigger=t.dataset.v;en.u=Date.now();save();}pick('doneTrigger',t.dataset.v);}
  else if(f==='action'){const i=A.actions.indexOf(t.dataset.v);i<0?A.actions.push(t.dataset.v):A.actions.splice(i,1);saveLocal();t.setAttribute('aria-pressed',i<0);}
  else if(f==='tool'){flow.tool=t.dataset.v;LY.querySelectorAll('[data-f="tool"]').forEach(c=>c.setAttribute('aria-pressed',c===t));$('#tool').innerHTML=toolHTML();}
  else if(f==='groundNext'){flow.ground++;vibrate(15);$('#tool').innerHTML=toolHTML();}
  else if(f==='groundReset'){flow.ground=0;$('#tool').innerHTML=toolHTML();}
  else if(f==='more'){A.durMin=Math.ceil((Date.now()-A.start)/60000)+(A.intensity>=8?10:5);A.phase=0;saveLocal();flow.step='ride';drawFlow();}
  else if(f==='plus5'){A.durMin+=5;saveLocal();vibrate(20);tick();toast('5 more minutes added');}
  else if(f==='passed'){vibrate(30);finishUrge('rode');}
  else if(f==='slipped'){if(await ask('Log this as a slip?','Your day count will restart. Your wins stay.','Log it'))finishUrge('slipped');}
  else if(f==='finish'){const n=($('#fnote')||{}).value;const en=D.entries.find(x=>x.id===flow.result);if(en&&n&&n.trim()){en.note=n.trim();en.u=Date.now();save();}closeFlow();}
  else if(f==='finishSlip'){const en=D.entries.find(x=>x.id===flow.result);if(en){const r=reflectVals();if(r)en.reflect=r;if(!en.trigger&&flow.slip.trigger)en.trigger=flow.slip.trigger;en.u=Date.now();save();}closeFlow();toast('Logged. Tomorrow is a new day one.');}
  else if(f==='saveSlip'){const now=Date.now(),en={id:uid(),ts:now,u:now,kind:'slip',trigger:flow.slip.trigger,intensity:flow.slip.intensity,actions:[],outcome:'slipped',note:''};
    const r=reflectVals();if(r)en.reflect=r;D.entries.push(en);sortByTs(D.entries);save();closeFlow();toast('Logged. Tomorrow is a new day one.');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&flow&&!LY.hidden&&!document.querySelector('.modal-back')){const c=LY.querySelector('[data-f="close"]');if(c)c.click();}});

/* ================= lock ================= */
async function hashPin(pin){const data=enc.encode('steady:'+pin);
  if(window.crypto&&crypto.subtle)return toHex(await crypto.subtle.digest('SHA-256',data));
  let h=5381;for(const c of data)h=((h<<5)+h+c)|0;return'd'+(h>>>0).toString(16);}
const LK=$('#lock');let locked=false;
function lock(){if(!L.pinHash||locked)return;locked=true;LK.hidden=false;
  LK.innerHTML=`<div class="lockpad">${icon('lock')}<h1 style="margin-top:12px">Steady</h1><p class="muted" style="margin-top:6px">Enter your PIN</p>
  <form id="lockF"><input class="input" id="lockIn" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" maxlength="8" aria-label="PIN" enterkeyhint="done"><button class="btn btn-primary btn-block" style="margin-top:14px">Unlock</button></form><p class="faint" id="lockMsg" style="margin-top:12px" aria-live="polite"></p></div>`;
  setTimeout(()=>$('#lockIn').focus(),50);
  $('#lockF').addEventListener('submit',async ev=>{ev.preventDefault();const v=$('#lockIn').value;
    if(await hashPin(v)===L.pinHash){locked=false;LK.hidden=true;LK.innerHTML='';handlePairLink();}else{$('#lockMsg').textContent='That’s not it. Try again.';$('#lockIn').value='';}});
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return;}
  if(hiddenAt&&Date.now()-hiddenAt>60000)lock();
  if(flow&&flow.step==='ride'){keepAwake(true);tick();}
  if(!flow)render();syncNow();
});
window.addEventListener('online',()=>syncNow());

/* ================= boot ================= */
function applyTheme(){const r=document.documentElement;if(L.theme==='system')r.removeAttribute('data-theme');else r.dataset.theme=L.theme;}
applyTheme();render();
if(L.active&&L.active.start){openFlow('ride');if(Date.now()-L.active.start>=L.active.durMin*60000){flow.step='check';drawFlow();}}
lock();if(!locked)handlePairLink();
syncNow();
setInterval(()=>{if(!flow&&!document.hidden){if(UI.tab==='today')render();}},60000);
setInterval(()=>{if(!document.hidden)syncNow();},120000);
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
